version: "3.8"

services:
  mongotest:
    image: mongo:latest
    container_name: mongodbtest
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ALADIN2025
    volumes:
      - mongo2-data:/data/db
    networks:
      - mongonet

  mongotest-express:
    image: mongo-express:latest
    container_name: mongotest-express
    ports:
      - "80:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: ALADIN2025
      ME_CONFIG_MONGODB_SERVER: mongotest
    depends_on:
      - mongotest
    networks:
      - mongonet

volumes:
  mongo2-data:
    name: mongo2-data

networks:
  mongonet:


#exec to run into the container
#sudo docker exec -it [server hash] /bin/bash