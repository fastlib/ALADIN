name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            arch: x86_64

          - name: Windows x86_64
            os: windows-latest
            arch: AMD64

          - name: macOS arm64
            os: macos-14
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Free disk space
        if: runner.os == 'macOS'
        run: |
          df -h
          brew cleanup -s || true
          rm -rf ~/Library/Caches/Homebrew || true
          df -h

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Build only Python 3.11–3.14
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"

          # Don't build PyPy or musllinux variants
          CIBW_SKIP: "pp* *-musllinux_*"

          # Platform-specific architecture
          CIBW_ARCHS: ${{ matrix.arch }}

          CIBW_BEFORE_ALL_MACOS: >
            brew install libomp

          CIBW_ENVIRONMENT_MACOS: >
            LIBOMP_PREFIX=/opt/homebrew/opt/libomp

          # Smoke-test the installed wheel
          CIBW_TEST_COMMAND: >
            python -c "import aladin;
            print('ALADIN import successful')"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs:
      - build_wheels
      - build_sdist

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
