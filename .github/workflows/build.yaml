name: Cross-platform build

on:
  push:
    paths:
      - "aladin/**"
      - "nnUNet/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "aladin/**"
      - "nnUNet/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 ninja cmake
          python -m pip install torch

      - name: Compile Python files
        run: python -m pip install . --no-build-isolation

      - name: Run tests
        run: |
          hf auth login --token "$HF_TOKEN"
          python -m pytest aladin/tests

  macosx:
    name: macOS build
    runs-on: macos-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          brew install libomp
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 ninja cmake
          python -m pip install torch
          python -m pip install . --no-build-isolation

      - name: Run tests
        run: |
          hf auth login --token "$HF_TOKEN"
          python -m pytest aladin/tests

  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 ninja cmake
          python -m pip install torch
          python -m pip install . --no-build-isolation

      - name: Run tests
        run: |
          hf auth login --token "$HF_TOKEN"
          python -m pytest aladin/tests
