name: Cross-platform build

on:
  push:
    paths:
      - "aladin/**"
      - "nnUNet/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "aladin/**"
      - "nnUNet/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          # - os: ubuntu-latest
          #   python-version: "3.11"
          # - os: ubuntu-latest
          #   python-version: "3.12"
          # - os: ubuntu-latest
          #   python-version: "3.13"
          # - os: macos-latest
          #   python-version: "3.13"
          # - os: windows-latest
          #   python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core pybind11 ninja cmake
          python -m pip install torch
          python -m pip install ./nnUNet

      - name: Compile Python files
        run: python -m pip install ./aladin --no-build-isolation

      - name: Run tests
        run: python -m pytest